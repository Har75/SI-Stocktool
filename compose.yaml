services:
  si-stocktool:
    build: .
    ports:
      - "80:4721"
    environment:
      # Overrides the image NODE_ENV=production so a local env key can be used.
      # Public Render/Fly deploys should keep NODE_ENV=production and leave the key unset.
      NODE_ENV: development
      PORT: "4721"
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    restart: unless-stopped
